# Netlify settings for the store TV page.
# In Netlify set "Base directory" to  tv  (everything below is relative to it).
# Netlify needs one environment variable: APP_URL = the store app's address,
# for example https://valley-lotto.onrender.com (no slash at the end needed).

[build]
  publish = "."

  # Writes _redirects so the page's /api/numbers is passed through to the app.
  # Stops with a plain message when APP_URL is missing or not a web address.
  command = 'if [ -z "$APP_URL" ]; then echo "STOPPED: APP_URL is not set. In Netlify open Site configuration > Environment variables, add APP_URL with your store app address (like https://your-app.onrender.com), then deploy again."; exit 1; fi; case "$APP_URL" in http://*|https://*) ;; *) echo "STOPPED: APP_URL must start with https:// (it is now: $APP_URL)"; exit 1;; esac; printf "/api/numbers  %s/api/numbers  200!\n" "${APP_URL%/}" > _redirects; echo "OK: the TV page will read its numbers from ${APP_URL%/}/api/numbers"'

  # Only rebuild when something in tv/ changed. Exit 1 = build, exit 0 = skip.
  # A first deploy or a re-deploy of the same commit (for example after changing
  # APP_URL) always builds.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

# Netlify already makes browsers re-check the page, its script and games.json
# on every load, so the hourly reload picks up any change.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Fonts and logos rarely change: let the TV keep them for a day.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
