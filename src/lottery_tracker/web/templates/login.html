{% extends "base.html" %}
{% block title %}Log in — Valley Lotto{% endblock %}
{% block body %}
<div class="card">
  <h2>Log in</h2>
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" value="{{ email }}" autocomplete="username" required>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <div class="row" style="margin-top:16px">
      <button class="primary" type="submit">Log in</button>
      <a class="btn" href="{{ url_for('register') }}">Create account</a>
    </div>
  </form>
</div>
{% endblock %}
