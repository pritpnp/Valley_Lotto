<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}Valley Lotto{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1420; --panel: #1a2131; --panel2: #232c40; --ink: #eef2f8;
      --muted: #9aa7bd; --line: #313c54; --accent: #3b82f6; --accent-ink: #fff;
      --ok: #22c55e; --ok-bg: #0f3d24; --warn: #f59e0b; --warn-bg: #3d2f0f;
      --err: #ef4444; --err-bg: #3d1616; --pending: #2a3348;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:#f4f6fb; --panel:#fff; --panel2:#eef2f8; --ink:#141a26; --muted:#5b6779;
        --line:#dce3ee; --pending:#e6ebf4; --ok-bg:#dcfce7; --warn-bg:#fef3c7; --err-bg:#fee2e2;
      }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    header.bar { display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    header.bar .brand { font-weight:700; letter-spacing:.2px; }
    header.bar .who { color:var(--muted); font-size:13px; }
    a { color:var(--accent); text-decoration:none; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
      padding:18px; margin:14px 0; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input[type=text], input[type=email], input[type=password] {
      width:100%; padding:14px; font-size:17px; border-radius:10px;
      border:1px solid var(--line); background:var(--panel2); color:var(--ink); }
    button, .btn { cursor:pointer; border:none; border-radius:10px; padding:13px 16px;
      font-size:16px; font-weight:600; background:var(--panel2); color:var(--ink);
      border:1px solid var(--line); }
    button.primary, .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
    button:active { transform: translateY(1px); }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .muted { color:var(--muted); }
    .flash { padding:12px 14px; border-radius:10px; margin:10px 0; }
    .flash.err { background:var(--err-bg); }
    .flash.warn { background:var(--warn-bg); }
    .flash.ok { background:var(--ok-bg); }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:13px; }
    code { background:var(--panel2); padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">🎟️ Valley Lotto</div>
    <div class="who">
      {% if email %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a> ·
        <a href="{{ url_for('catalog') }}">Catalog</a> ·
        <a href="{{ url_for('inventory') }}">Inventory</a> ·
        <a href="{{ url_for('weights_page') }}">Emphasis</a> ·
        <a href="{{ url_for('count') }}">Scan</a> ·
        <a href="{{ url_for('report') }}">Sales</a> ·
        <form method="post" action="{{ url_for('logout') }}" style="display:inline">
          <button style="padding:4px 10px;font-size:13px">Log out</button></form>
      {% endif %}
    </div>
  </header>
  <div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
