# Valley Lotto configuration
# ---------------------------------------------------------------------------
# Settings for the twice-daily PA tracker: how games are rated and what it
# collects. Each store's own games live in the app, not here.

# Which games each store carries now lives in the app's database (Supabase), set
# from the box map and Active Inventory, and the app's dashboard reads it live,
# behind its login. This repo is public, so no store's lineup is kept here.
inventory: []

# When is a game's prize pool "too low" to keep on the counter?
# A game is flagged if ANY rule below trips. Set a rule to null to disable it.
thresholds:
  # WIN ODDS — the main "is this game worth playing?" number. PA publishes the
  # overall odds of winning ANY prize (e.g. 1:3.82). Lower is better, and it stays
  # about the same for a game's whole life, so it's the best guide to which games
  # give customers a fair shot at breaking even. Flag games worse than this cutoff.
  weak_odds: 4.5             # mark a game 🔻 WEAK ODDS if its odds are worse than 1:4.5

  # SWAP — separately, drop a game once its big prizes are mostly claimed (the
  # value/excitement is drained), even if the odds are still fine. The original top
  # count comes from each game's PA detail page ("offers N Top Prizes of $X").
  top_prize_pct: 0.40        # 🟠 SWAP when fewer than 40% of the top prizes remain
  top_prize_count_floor: 1   # OR when the top prize is down to its last 1 (and depleting)

# KEEP vs SEND BACK is one 0-100 rating combining four parts, each a figure PA
# publishes, scored 0-100. A game is SENT BACK when its rating falls below
# `cutoff`. Change the weights to say what matters most (0 ignores a part). A
# part PA's figures can't support is left out, and the rest share its weight.
rating_weights:
  prizes_left: 40          # reported prizes still out there, top prize aside (counts most)
  win_back: 25             # how often a ticket wins more than it cost, vs the best at its price
  top_prizes: 20           # top prizes still out there (counts, but less)
  odds: 15                 # how often a ticket wins anything, vs the best at its price
  cutoff: 50               # rating below this -> SEND BACK

# If true, evaluate the low-prize rule for EVERY active game (useful for spotting
# fresh games worth stocking) using the estimated original count. True original
# counts are only fetched for the games in `inventory` above (one detail-page
# request each, cached). Ended-game alerts always cover every game.
report_all_games: true

# Catalog scout: also pull the full prize structure for EVERY active PA game (not
# just your inventory) so the dashboard can rank the best games to BRING IN. The
# first fill fetches a lot (cached forever after), spread over a few runs.
scout_catalog: true
bring_in_min_left: 0.6     # only suggest games with at least this share of prizes left (fresh)
bring_in_per_price: 4      # how many suggestions to show per price point
max_new_fetches: 250       # cap on new detail/bulletin fetches per run

# Storage: we scrape twice a day. EVERY scrape is recorded (timestamp + content
# hash) in data/scrape_log.jsonl — an append-only archive that is never deleted.
# A full parsed snapshot (data/snapshots/) + the raw HTML (data/raw/) are stored
# ONLY when the data actually changed since the last scrape (even by one number);
# identical scrapes are archived in the log without duplicating the data. Nothing
# that differs is ever pruned, so the change history is kept in full.

# ---------------------------------------------------------------------------
# Pack (book) sizes: how many tickets are in a full pack. Used by the scan
# tracker to turn "open ticket -> close ticket" into tickets sold, and to bridge
# a pack changeover. PA packs are built to a fixed DOLLAR VALUE, so the ticket
# count depends on price (tickets = pack_value / price). Tickets in a pack are
# numbered 000..N-1 and count UP as they sell.
#
# These are OPTIONAL seeds: real pack sizes are learned automatically from the
# scan log (a scan past a configured size corrects it upward). The $30/$40 rows
# are UNVERIFIED guesses — confirm from the PA retailer "Settled Packs" report.
pack_sizes:
  by_price:
    1: 300             # $300 book  (derived)
    2: 150             # $300 book  (well-attested)
    3: 100             # $300 book  (derived)
    5: 60              # $300 book  (well-attested)
    10: 60             # $600 book  (well-attested)
    20: 30             # $600 book  (well-attested)
    30: 20             # ?? UNVERIFIED — could be 20/30/50. FIX ME.
    40: 15             # ?? UNVERIFIED — undocumented. FIX ME.
    50: 50             # $2,500 book
  by_game: {}          # exact per-game overrides, e.g.  "1750": 20
  use_builtin_fallback: true
