name: PA numbers and order list

# Reads what Pennsylvania publishes and saves it in the app's database:
#   * at 4, 14, 24, 34, 44 and 54 minutes past each hour, the winning numbers
#     of every draw game (for the store TVs), plus the old Powerball/Mega
#     Millions scraper while the two are checked side by side;
#   * at 37 minutes past each hour, the weekly "Scratch-Offs Available for
#     Ordering" list.
# "Run workflow" in the Actions tab does both.
#
# GitHub's schedule is best-effort: it starts runs late, and drops many, most
# of all around the top of the hour, when everyone's runs are due (on one day
# it ran the numbers 6 times in 18 hours). Hence the odd minutes. So the TVs
# don't depend on it: the store app reads PA's numbers itself whenever a TV (or
# Netlify's check every 10 minutes) asks and its copy is over 5 minutes old.
# Only one of the two reads them at a time. The app sends no Telegram messages
# (Render has no Telegram settings): they wait in the database, and every run
# here sends them first. These runs still read the numbers too, as a backup,
# and are the ones that say on Telegram when the database itself has a problem.
#
# Problems (PA's site down for over an hour, a format change) go to Telegram
# once, and the run still ends green: a red X here means a bug in the code,
# not PA having a bad day, so it can't turn into an email every ten minutes.
# A database problem (it can't be reached, turns down the login, has gone
# read-only, or the DATABASE_URL secret isn't a usable link) is a yellow warning
# here, not a red X. It's told on Telegram once a day while it lasts, on the
# run that starts between 9:00 and 9:10 AM Eastern. (keepalive.yml can't see
# it: that checks the app, which has its own copy of the link on Render.)
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # numbers (GitHub's schedule is UTC)
    - cron: "37 * * * *"                 # order list
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pa-feeds
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-app.txt
            requirements-feeds.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-app.txt -r requirements-feeds.txt

      - name: Read PA's feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          PYTHONPATH: src
        run: |
          case "$SCHEDULE" in
            "4,14,24,34,44,54 * * * *") what=numbers ;;
            "37 * * * *")               what=orders ;;
            *)                          what=all ;;
          esac
          python -m lottery_tracker.pa_feeds "$what"
