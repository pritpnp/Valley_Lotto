name: Track scratch-offs

# Runs the tracker on a schedule, commits the new snapshot/report, and opens a
# GitHub Issue when there's a new alert (a game you carry ended, or prizes got low).
on:
  schedule:
    # Twice a day — ~12am and ~12pm Eastern (04:00 & 16:00 UTC during EDT).
    # GitHub cron is UTC only, so this drifts ~1h when the US changes clocks.
    - cron: "0 4,16 * * *"
  workflow_dispatch: {}     # lets you run it on demand from the Actions tab.

permissions:
  contents: write           # to commit the snapshot/report back to the repo
  issues: write             # to open an alert issue

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        id: run
        # Exit codes are how the tracker distinguishes three different outcomes:
        #   0  — ran, nothing urgent
        #   2  — ran, and something needs attention (an expected signal)
        #  75  — PA's website didn't answer. Their outage, not our bug, and the
        #        next run is twelve hours away; a red X here would be crying
        #        wolf. Logged as a warning so a run of them is still visible.
        # Anything else is a real failure and fails the job.
        env:
          # Email is optional. Set these as repo secrets to turn it on.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          PYTHONPATH=src python -m lottery_tracker
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0|2) exit 0 ;;
            75)  echo "::warning::PA's website did not answer. Nothing was" \
                      "updated; the next scheduled run will try again." ; exit 0 ;;
            *)   exit "$code" ;;
          esac

      - name: Commit snapshot and report
        if: steps.run.outputs.exit_code != '75'
        run: |
          git config user.name "valley-lotto-bot"
          git config user.email "actions@github.com"
          git add data reports docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily scratch-off snapshot $(date -u +%Y-%m-%d)"
            git push
          fi


      - name: Open an issue if there are new alerts
        if: steps.run.outputs.exit_code != '75'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s reports/alerts.json ]; then exit 0; fi
          count=$(python -c "import json,sys; print(len(json.load(open('reports/alerts.json'))))")
          if [ "$count" -eq 0 ]; then
            echo "No new alerts."
            exit 0
          fi
          title="🎟️ Valley Lotto: $count new alert(s) — $(date -u +%Y-%m-%d)"
          gh issue create --title "$title" --body-file reports/latest.md --label "lottery-alert" \
            || gh issue create --title "$title" --body-file reports/latest.md

      # Every run, every game: rate it, check it, build the report from it, and
      # confirm the code obeyed its own rules. A new game that breaks a rule
      # fails this run, and a failed run is what emails you. PA's numbers
      # contradicting each other never fail it: the rules handle those.
      - name: Check every game against the code's rules
        if: steps.run.outputs.exit_code != '75'
        run: python tools/audit_all.py --days 1 --no-app --ref HEAD --with-local --fail-on-code

      # Anything above failing (the tracker crashing, or the rule check finding a
      # bug) is worth a Telegram message, not only GitHub's email.
      - name: Tell Telegram this run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: >-
          python -m lottery_tracker.telegram
          "⚠️ Valley Lotto: the twice-daily PA check failed and needs a look.
          Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
