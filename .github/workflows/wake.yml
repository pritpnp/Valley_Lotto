name: Keep the site awake during store hours

# Render's free plan puts the site to sleep after 15 minutes with no visitors,
# and the first person back waits about a minute while it wakes. A visit every
# ten minutes through store hours keeps it awake then, and the 750 free hours a
# month cover even round-the-clock running, so this costs nothing.
#
# This never fails, on purpose. A failed run sends an email, and at this
# frequency a short outage would be dozens of them. Reporting outages is the
# daily keepalive.yml job's work.
#
# GitHub sometimes runs scheduled jobs late, so the odd slow first load is still
# possible. Uses the same APP_URL repository variable as keepalive.yml.

on:
  schedule:
    # Store hours, 8am to 10pm Eastern. Cron runs on UTC, and Eastern shifts by
    # an hour between summer and winter, so this spans both: first visit at
    # 11:50 UTC (7:50am in summer, 6:50am in winter), last at 02:50 UTC (10:50pm
    # in summer, 9:50pm in winter, and the site stays awake 15 minutes after
    # that). Either way it is awake for the whole 8am-10pm day.
    - cron: "50 11 * * *"
    - cron: "*/10 12-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch: {}

concurrency:
  group: wake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          [ -n "$APP_URL" ] || { echo "No APP_URL variable set."; exit 0; }
          curl -sS --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "${APP_URL%/}/healthz" || true
