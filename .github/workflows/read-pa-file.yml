name: Read a PA Lottery file

# Downloads one file from palottery.pa.gov (a PDF or a page) and prints its text
# into the run log, so it can be read from places that can't reach PA's site.
# Only PA Lottery addresses are accepted.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Address on palottery.pa.gov"
        required: true

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pypdf beautifulsoup4
      - name: Download and print
        env:
          URL: ${{ inputs.url }}
        run: |
          case "$URL" in
            https://www.palottery.pa.gov/*|https://palottery.pa.gov/*) ;;
            *) echo "::error::Only palottery.pa.gov addresses."; exit 1 ;;
          esac
          curl -sSL --max-time 60 -A "Mozilla/5.0" -o file "$URL"
          python - <<'PY'
          from pathlib import Path
          data = Path("file").read_bytes()
          if data[:4] == b"%PDF":
              from pypdf import PdfReader
              r = PdfReader("file")
              print(f"PDF, {len(r.pages)} page(s)")
              for i, p in enumerate(r.pages, 1):
                  print(f"===== page {i} =====")
                  print(p.extract_text(extraction_mode="layout"))
          else:
              from bs4 import BeautifulSoup
              print(BeautifulSoup(data, "html.parser").get_text("\n")[:20000])
          PY
