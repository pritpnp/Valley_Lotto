name: Keep the app and its database awake

# Supabase pauses a free project after a week without activity, and an app that
# nobody has opened yet produces none — so the store's data would be taken
# offline before the store ever went live. One request a day is enough activity
# to prevent that, and /healthz touches the database as part of answering.
#
# It doubles as a plain uptime check: if the site or the database is down, this
# says so once a day rather than a clerk finding out mid-count.
#
# Set the repository variable APP_URL to the store's address (Settings →
# Secrets and variables → Actions → Variables). Without it this does nothing.

on:
  schedule:
    - cron: "17 13 * * *"     # once a day, mid-morning Eastern
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::No APP_URL variable set, so there is nothing to ping."
            echo "Set it to your site's address to keep the database awake."
            exit 0
          fi

          url="${APP_URL%/}/healthz"
          echo "Pinging $url"

          # The host sleeps idle sites, so the first request can be slow.
          # Try a few times before calling it down.
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 60 "$url") && break
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done

          echo "$body"
          # A down site FAILS the run rather than warning: a failed run is what
          # makes GitHub email you. Warnings went unread for two weeks while
          # Railway had taken the app offline.
          case "$body" in
            *'"database": true'*|*'"database":true'*)
              echo "::notice::App and database both answered." ;;
            "")
              why="The site did not answer at all. Check Render."; echo "::error::$why"; echo "WHY=$why" >> "$GITHUB_ENV"
              exit 1 ;;
            *'Application not found'*|*'not found'*|*'<html'*|*'<!DOCTYPE'*)
              why="No app is running at $APP_URL. The hosting service stopped or removed it. Check Render."; echo "::error::$why"; echo "WHY=$why" >> "$GITHUB_ENV"
              exit 1 ;;
            *'"database": false'*|*'"database":false'*)
              why="The app is up but can't reach its database. Check Supabase; the project may be paused."; echo "::error::$why"; echo "WHY=$why" >> "$GITHUB_ENV"
              exit 1 ;;
            *)
              why="Something answered, but not the app. Check Render."; echo "::error::$why"; echo "WHY=$why" >> "$GITHUB_ENV"
              exit 1 ;;
          esac

      # The same news on Telegram, if it's set up (repository secrets
      # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID). Without them this does nothing.
      - name: Tell Telegram the site is down
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          curl -sS -o /dev/null --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 Valley Lotto is down. ${WHY:-The daily check failed.}
          Details: ${RUN_URL}" || true
