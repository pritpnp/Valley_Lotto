name: Send the send-back list to Telegram

# Press "Run workflow" in the Actions tab for the current list of games on sale
# rated under 50 out of 100: the same rating the app shows. (Games that newly
# drop under the line are also announced by the twice-daily run.)

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send it
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: python -m lottery_tracker.telegram --low-games
