name: Send the send-back list to Telegram

# Every morning, the games on sale to send back: those selling under 20% of the
# typical game at their price across PA, the same rating the app shows. Press
# "Run workflow" in the Actions tab to get it any other time. (Games that newly
# drop under the line are also announced by the twice-daily data run.)

on:
  schedule:
    # Once a day, before the store opens: 7:52am Eastern in summer, 6:52am in
    # winter (GitHub's schedule runs on UTC, which doesn't change with the
    # clocks). It reads the data from the midnight run. GitHub sometimes starts
    # scheduled jobs a few minutes late.
    - cron: "52 11 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send it
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: python -m lottery_tracker.telegram --low-games
